<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio Testing Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="card">
    <header class="card-header">
      <p class="eyebrow">Twilio</p>
      <h1>OTP Testing Portal</h1>
      <p class="subtitle">Test Twilio Verify channels from one place.</p>
    </header>

    <!-- Step 1: request an OTP for a phone number -->
    <section id="send-section">
      <label for="phone-number">Phone Number</label>
      <input
        type="tel"
        id="phone-number"
        placeholder="+919876543210"
        autocomplete="off"
      />
      <p class="hint">Use full E.164 format, e.g. +91 for India.</p>

      <p class="field-label">Verification Channel</p>
      <div class="channel-buttons">
        <button id="send-sms-btn">SMS OTP</button>
        <button id="send-whatsapp-btn">WHATSAPP OTP</button>
      </div>
    </section>

    <!-- Step 2: submit the code Twilio sent -->
    <section id="verify-section" class="hidden">
      <label for="otp-code">Verification Code</label>
      <input type="text" id="otp-code" placeholder="123456" autocomplete="off" />
      <button id="verify-btn" class="primary-btn">VERIFY OTP</button>
    </section>

    <p id="status-message"></p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
