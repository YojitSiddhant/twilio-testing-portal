<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio Testing Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <h1>TWILIO OTP TESTING</h1>

  <!-- Step 1: request an OTP for a phone number -->
  <section id="send-section">
    <label for="phone-number">Phone Number</label>
    <input
      type="tel"
      id="phone-number"
      placeholder="+919876543210"
      autocomplete="off"
    />
    <p class="hint">Use full E.164 format, e.g. +91 for India.</p>
    <div class="channel-buttons">
      <button id="send-sms-btn">SEND SMS OTP</button>
      <button id="send-whatsapp-btn">SEND WHATSAPP OTP</button>
    </div>
  </section>

  <!-- Step 2: submit the code Twilio sent via SMS -->
  <section id="verify-section" class="hidden">
    <label for="otp-code">OTP Code</label>
    <input type="text" id="otp-code" placeholder="123456" autocomplete="off" />
    <button id="verify-btn">VERIFY OTP</button>
  </section>

  <p id="status-message"></p>

  <script src="js/app.js"></script>
</body>
</html>
