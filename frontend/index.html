<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Twilio Testing Portal</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <header class="page-header">
      <p class="eyebrow">Twilio</p>
      <h1>Testing Portal</h1>
      <p class="subtitle">A developer dashboard for testing Twilio Verify and SendGrid.</p>
    </header>

    <div class="panels">
      <section class="panel">
        <h2 class="panel-title">OTP Verification</h2>

        <!-- Step 1: request an OTP for a phone number -->
        <div id="send-section">
          <label for="phone-number">Phone Number</label>
          <input
            type="tel"
            id="phone-number"
            placeholder="+919876543210"
            autocomplete="off"
          />
          <p class="hint">Use full E.164 format, e.g. +91 for India.</p>
          <button id="send-sms-btn" class="primary-btn">SEND SMS OTP</button>
        </div>

        <!-- Step 2: submit the code Twilio sent -->
        <div id="verify-section" class="hidden">
          <label for="otp-code">OTP Code</label>
          <input type="text" id="otp-code" placeholder="123456" autocomplete="off" />
          <button id="verify-btn" class="primary-btn">VERIFY OTP</button>
        </div>

        <p id="status-message"></p>
      </section>

      <section class="panel">
        <h2 class="panel-title">Email Testing</h2>

        <label for="email-recipient">Recipient Email</label>
        <input
          type="email"
          id="email-recipient"
          placeholder="example@email.com"
          autocomplete="off"
        />

        <label for="email-subject">Subject</label>
        <input
          type="text"
          id="email-subject"
          placeholder="Twilio Email Test"
          autocomplete="off"
        />

        <label for="email-message">Message</label>
        <textarea
          id="email-message"
          rows="4"
          placeholder="This is a test email from my Twilio Testing Portal."
        ></textarea>

        <button id="send-email-btn" class="primary-btn">SEND TEST EMAIL</button>

        <p id="email-status-message"></p>
      </section>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
